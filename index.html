<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>From My Table</title>
  <meta name="theme-color" content="#f9f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#241c22" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="From My Table">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try {
      const t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <a class="brand" href="#/">From My Table</a>
    <nav>
      <a href="#/">Search</a>
      <a href="#/events">Events</a>
      <a href="#/guests">Guests</a>
      <a href="#/dishes">Dishes</a>
      <a href="#/settings">Settings</a>
    </nav>
  </header>
  <main id="main"><p class="muted">Loading…</p></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
